name: Action boundary example
on:
  pull_request:
    paths:
      - 'examples/action-boundary/**'
      - '.github/workflows/action-boundary-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/action-boundary/**'
      - '.github/workflows/action-boundary-example.yml'
permissions:
  contents: read
jobs:
  public-consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        working-directory: examples/action-boundary
      - run: npm start && npm test
        working-directory: examples/action-boundary
