name: Hermes hook example
on:
  pull_request:
    paths:
      - 'examples/hermes-hook/**'
      - '.github/workflows/hermes-hook-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/hermes-hook/**'
      - '.github/workflows/hermes-hook-example.yml'
permissions:
  contents: read
jobs:
  public-consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        working-directory: examples/hermes-hook
      - run: npm test
        working-directory: examples/hermes-hook
      - run: npm run demo
        working-directory: examples/hermes-hook
