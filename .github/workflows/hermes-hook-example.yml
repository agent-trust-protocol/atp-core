name: Hermes hook example
on:
  pull_request:
    paths:
      - 'examples/hermes-hook/**'
      - '.github/workflows/hermes-hook-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/hermes-hook/**'
      - '.github/workflows/hermes-hook-example.yml'
permissions:
  contents: read
jobs:
  public-consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        working-directory: examples/hermes-hook
      - run: npm test
        working-directory: examples/hermes-hook
      - run: npm run demo
        working-directory: examples/hermes-hook

  runtime-integration:
    name: Hermes runtime (scripted local provider)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: atp-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 55ee4acdd822b73fb9573a2321531ae3a9d0b3e0
          path: hermes-atp-pilot
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.4'
          enable-cache: false
      - run: npm ci --ignore-scripts
        working-directory: atp-core/examples/hermes-hook
      - run: uv sync --frozen --python 3.14 --no-dev
        working-directory: hermes-atp-pilot
      - name: Verify real read and terminal denial (not autonomous reasoning or revocation)
        run: .venv/bin/python ../atp-core/examples/hermes-hook/verify-live-hermes.py
        working-directory: hermes-atp-pilot
