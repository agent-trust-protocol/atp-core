name: Code Analysis

# Free, open-source PR code analysis — the OSS replacement for the (now-removed)
# recurseml GitHub App.
#
# Semgrep OSS — open-source static analysis (LGPL), registry rulesets, no token.
# Runs as an ADVISORY check: findings surface as inline PR annotations and in the
# repository Security tab, but never fail the PR. No LLM/API key or paid secret
# is required.
#
# NOTE on CodeQL: this repo uses GitHub's CodeQL *default setup* (Settings → Code
# security → CodeQL analysis), which already scans pull requests. A custom CodeQL
# workflow cannot upload alongside default setup ("CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled"), so
# CodeQL is intentionally NOT duplicated here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: code-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  semgrep:
    name: Semgrep (OSS)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (advisory)
        # Free registry rulesets — no login / SEMGREP_APP_TOKEN required.
        # `|| true` keeps the scan advisory: findings are reported via SARIF,
        # never by failing the job. The scan itself runs on every PR, forks
        # included (no write permission needed).
        run: |
          semgrep scan \
            --sarif --output=semgrep.sarif \
            --config p/default \
            --config p/secrets \
            --config p/typescript \
            --config p/javascript || true

      - name: Upload Semgrep SARIF artifact
        # Always attach the SARIF as a downloadable artifact (works on fork PRs,
        # which skip the code-scanning upload below) so findings are readable
        # even when they can't be pushed to the Security tab.
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7

      - name: Upload Semgrep results
        # Only the upload needs security-events: write, which forked PRs don't
        # get — so gate just this step to push + same-repo PRs (forks still run
        # the scan above; their findings show in the Actions log and get
        # uploaded once merged to main). Also skip if the scan wrote no SARIF,
        # and keep upload failures non-blocking (advisory).
        if: >-
          always()
          && hashFiles('semgrep.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
