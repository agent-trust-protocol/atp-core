name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - sdk
          - openclaw-atp
          - both

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-sdk:
    name: Publish atp-sdk
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.package == 'sdk' || inputs.package == 'both'))
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: cd packages/sdk && npm test

      - name: Build
        run: cd packages/sdk && npm run build

      - name: Publish
        run: cd packages/sdk && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-openclaw:
    name: Publish @atpdevelopment/openclaw-atp
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.package == 'openclaw-atp' || inputs.package == 'both'))
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build SDK dependency
        run: cd packages/sdk && npm run build

      - name: Build
        run: cd packages/openclaw-atp && npm run build

      - name: Publish
        run: cd packages/openclaw-atp && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
