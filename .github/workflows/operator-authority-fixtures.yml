name: Operator authority fixture tests

on:
  pull_request:
    paths:
      - 'examples/operator-authority/**'
      - 'packages/sdk/src/utils/crypto.ts'
      - 'packages/sdk/package-lock.json'
      - '.github/workflows/operator-authority-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked SDK dependencies for shared cryptographic utilities
        run: npm ci --include=dev --ignore-scripts --prefix packages/sdk
      - name: Read pinned external revision-2 corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Agent-Authority-Conformance/aps-conformance-suite
          ref: 7141c6167acfdd5288ec7cc1ca8d2ba9207b3390
          path: .lab-reference
          persist-credentials: false
      - name: Read pinned external revision-3 corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Agent-Authority-Conformance/aps-conformance-suite
          ref: 7774daee77a7766f737c6da71265c9e214b47ff5
          path: .lab-reference-r3
          persist-credentials: false
      - name: Run isolated operator authority test suites
        env:
          ATP_REQUIRE_LAB_CORPUS: '1'
          ATP_LAB_REVISION2_VECTORS: ${{ github.workspace }}/.lab-reference/fixtures/lease-revocation-axes/revision-2/vectors.json
          ATP_LAB_REVISION3_VECTORS: ${{ github.workspace }}/.lab-reference-r3/fixtures/lease-revocation-axes/revision-3/vectors.json
        run: node --test examples/operator-authority/*.test.mjs examples/operator-authority/revision-3/*.test.mjs
