name: ATP CLI interactive preview
on:
  pull_request:
    paths:
      - 'packages/atp-cli/**'
      - 'packages/create-atp-agent/**'
      - '.github/workflows/atp-cli-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Test new interactive CLI (no API credentials)
        run: npm test
        working-directory: packages/atp-cli
      - name: Test existing create-atp-agent compatibility
        run: |
          npm ci --ignore-scripts
          npm test
        working-directory: packages/create-atp-agent
