name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Require immutable action references
        run: |
          node scripts/check-action-pins.mjs
          node scripts/check-package-locks.mjs

      # Reproducible install straight from the committed lockfile.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Coverage YAML loader compatibility
        run: node --test scripts/tests/nyc-config-compat.test.cjs

      - name: Type check
        run: npm run type-check

      # No --passWithNoTests: an empty suite must fail, not pass green.
      - name: Unit tests
        run: npm test -- --ci

      - name: Build public packages
        run: |
          npm ci --include=dev --prefix packages/atp-profiles
          npm test --prefix packages/atp-profiles
          cd packages/atp-profiles && npm pack --pack-destination "$RUNNER_TEMP"
          cd ../sdk && npm install --no-save --package-lock=false --include=dev "$RUNNER_TEMP"/atp-profiles-*.tgz && npm run build

      - name: did-atp tests and clean consumer install
        run: |
          npm ci --include=dev --prefix packages/did-atp
          npm test --prefix packages/did-atp
          cd packages/did-atp
          did_version="$(node -p "require('./package.json').version")"
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/did-atp-consumer"
          cd "$RUNNER_TEMP/did-atp-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/atpdeveloper-did-atp-$did_version.tgz"
          node --input-type=module <<'JS'
          import { buildAtpV2Did, parseAtpV2PathDid, isAtpV2PathDid, verifyAtpV2KeyBindings, atpJwkThumbprint } from '@atpdeveloper/did-atp';
          import assert from 'node:assert/strict';
          const ed = new Uint8Array(32), pq = new Uint8Array(1952);
          const did = buildAtpV2Did('example.com', ['agent'], ed, pq);
          assert.deepEqual(parseAtpV2PathDid(did).path, ['agent']);
          assert.equal(isAtpV2PathDid(did), true);
          assert.equal(isAtpV2PathDid(did + '#key'), false);
          assert.equal(verifyAtpV2KeyBindings(did, ed, pq), true);
          const wrongPq = new Uint8Array(pq); wrongPq[0] = 1;
          assert.equal(verifyAtpV2KeyBindings(did, ed, wrongPq), false);
          const jwk = { crv: 'Ed25519', kty: 'OKP', x: '11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo' };
          assert.equal(atpJwkThumbprint({ ...jwk, kid: 'metadata' }), 'kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k');
          JS
          npm audit --omit=dev --audit-level=high

      - name: Package tests (sdk)
        run: |
          cd packages/sdk && npm test -- --ci && npm run examples

      - name: Starter template and SDK-major regression
        run: |
          npm ci --include=dev --prefix packages/create-atp-agent
          npm test --prefix packages/create-atp-agent

      # Hard gate: no critical advisories may ship.
      - name: Security audit (critical — blocking)
        run: npm audit --audit-level=critical

      # Advisory: surfaces high-severity debt (currently in the Next.js website
      # toolchain) without blocking merges. Tighten to blocking once the
      # remaining transitive upgrades land via Dependabot.
      - name: Security audit (high — advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
