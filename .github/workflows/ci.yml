name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Reproducible install straight from the committed lockfile.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # No --passWithNoTests: an empty suite must fail, not pass green.
      - name: Unit tests
        run: npm test -- --ci

      - name: Build public packages
        run: |
          npm ci --include=dev --prefix packages/atp-profiles
          npm test --prefix packages/atp-profiles
          cd packages/atp-profiles && npm pack --pack-destination "$RUNNER_TEMP"
          cd ../sdk && npm install --no-save --package-lock=false --include=dev "$RUNNER_TEMP/atp-profiles-1.1.0.tgz" && npm run build
          cd ../../packages/openclaw-atp && npm ci --include=dev && npm run build

      - name: did-atp tests and clean consumer install
        run: |
          npm install --include=dev --prefix packages/did-atp
          npm test --prefix packages/did-atp
          cd packages/did-atp
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/did-atp-consumer"
          cd "$RUNNER_TEMP/did-atp-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/atpdeveloper-did-atp-0.1.0.tgz"
          node --input-type=module -e "import { atpE1Fingerprint, buildAtpV2Did } from '@atpdeveloper/did-atp'; const ed = new Uint8Array(32); const pq = new Uint8Array(1952); if (!atpE1Fingerprint(ed).startsWith('e1_') || !buildAtpV2Did('example.com', ['agent'], ed, pq).startsWith('did:atp:example.com:agent:')) process.exit(1)"
          npm audit --omit=dev --audit-level=high

      - name: Package tests (sdk + openclaw-atp)
        run: |
          cd packages/sdk && npm test -- --ci
          cd ../../packages/openclaw-atp && npm test -- --ci

      # Hard gate: no critical advisories may ship.
      - name: Security audit (critical — blocking)
        run: npm audit --audit-level=critical

      # Advisory: surfaces high-severity debt (currently in the Next.js website
      # toolchain) without blocking merges. Tighten to blocking once the
      # remaining transitive upgrades land via Dependabot.
      - name: Security audit (high — advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
