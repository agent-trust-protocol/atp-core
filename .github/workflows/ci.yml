name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

      - name: Build public packages
        run: |
          cd packages/sdk && npm ci --include=dev && npm run build
          cd ../../packages/openclaw-atp && npm ci --include=dev && npm run build

      - name: Package tests (sdk + openclaw-atp)
        run: |
          cd packages/sdk && npm test -- --ci --passWithNoTests
          cd ../../packages/openclaw-atp && npm test -- --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
