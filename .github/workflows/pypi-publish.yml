name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Python package to release
        required: true
        type: choice
        options: [atp-profiles, agent-trust-protocol, atp-did]
      version:
        description: Exact version to release
        required: true
        type: string
      dry_run:
        description: Build and check without publishing
        required: true
        default: true
        type: boolean

jobs:
  pypi:
    if: github.ref == 'refs/heads/main' || inputs.dry_run == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.package == 'atp-did'
        with:
          node-version: '20'
      - name: Select package directory
        id: pkg
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            atp-profiles) echo "dir=packages/atp-profiles-python" >> "$GITHUB_OUTPUT" ;;
            agent-trust-protocol) echo "dir=packages/agent-trust-protocol-python" >> "$GITHUB_OUTPUT" ;;
            atp-did) echo "dir=packages/did-atp-python" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package $PACKAGE"; exit 1 ;;
          esac
      - name: Check exact version and refuse to republish
        env:
          PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.version }}
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open(os.path.join(os.environ["DIR"], "pyproject.toml"), "rb") as f:
              project = tomllib.load(f)["project"]
          assert project["name"] == os.environ["PACKAGE"], project["name"]
          assert project["version"] == os.environ["EXPECTED_VERSION"], project["version"]
          PY
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$EXPECTED_VERSION/json")
          if [ "$status" != 404 ]; then echo "Expected missing version (404), got HTTP $status; refusing release"; exit 1; fi
      - name: Test (atp-profiles)
        if: inputs.package == 'atp-profiles'
        working-directory: packages/atp-profiles-python
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and check distributions
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          python -m pip install --upgrade build twine
          python -m build "$DIR" --outdir dist
          python -m twine check dist/*
          ls -l dist
      - name: Verify installed atp-did wheel and SDK interoperability
        if: inputs.package == 'atp-did'
        env:
          ATP_TEST_CRYPTO: '1'
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/atp-did-release"
          "$RUNNER_TEMP/atp-did-release/bin/python" -m pip install "dist/atp_did-${EXPECTED_VERSION}-py3-none-any.whl[crypto]"
          npm install --prefix "$RUNNER_TEMP/sdk-reference" --no-package-lock atp-sdk@6.0.2
          export ATP_SDK_MODULE="file://$RUNNER_TEMP/sdk-reference/node_modules/atp-sdk/dist/index.js"
          "$RUNNER_TEMP/atp-did-release/bin/python" -m unittest discover -s packages/did-atp-python/tests -v
          printf 'temporary integration passphrase\n' | "$RUNNER_TEMP/atp-did-release/bin/python" packages/did-atp-python/examples/local_identity.py "$RUNNER_TEMP/release-example.keys.json"
          "$RUNNER_TEMP/atp-did-release/bin/python" -m pip check
      - name: Publish to PyPI
        if: inputs.dry_run != true
        # PyPI trusted publishing (OIDC); no stored token. Attestations are generated automatically.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
