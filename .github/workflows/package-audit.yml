name: Package dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [atp-support-agent, atp-profiles, audit-logger, cli, create-atp-agent, did-atp, hermes-hook, identity-service, monitoring-service, permission-service, protocol-integrations, rpc-gateway, sdk, session-sync-mcp, shared, vc-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Production dependencies (all severities gate)
        run: npm audit --prefix packages/${{ matrix.package }} --omit=dev --audit-level=low
      - name: Full dependencies (high and critical gate)
        run: npm audit --prefix packages/${{ matrix.package }} --audit-level=high
