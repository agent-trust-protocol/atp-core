name: Package dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [atp-support-agent, atp-profiles, audit-logger, create-atp-agent, did-atp, identity-service, monitoring-service, openclaw-atp, permission-service, protocol-integrations, rpc-gateway, sdk, session-sync-mcp, shared, vc-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Production dependencies (all severities gate)
        run: npm audit --prefix packages/${{ matrix.package }} --omit=dev --audit-level=low
      - name: Full dependencies (all severities gate)
        run: npm audit --prefix packages/${{ matrix.package }} --audit-level=low
