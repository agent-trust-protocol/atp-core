name: Package dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [atp-support-agent, atp-profiles, audit-logger, cli, create-atp-agent, did-atp, hermes-hook, identity-service, monitoring-service, permission-service, protocol-integrations, rpc-gateway, sdk, session-sync-mcp, shared, vc-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.package == 'audit-logger' && '22' || '20' }}
      - name: Test audit report policy
        run: node --test scripts/security/package-audit.test.mjs
      - name: Production dependencies (all severities gate)
        run: node scripts/security/package-audit.mjs "${{ matrix.package }}" production
      - name: Full dependencies (high and critical gate)
        run: node scripts/security/package-audit.mjs "${{ matrix.package }}" full
      - name: Verify Helia storage compatibility
        if: matrix.package == 'audit-logger'
        run: |
          npm ci --prefix packages/audit-logger --ignore-scripts --no-audit
          node --test packages/audit-logger/test/helia-smoke.test.mjs
