name: Developer entry points

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/verify-published-entry-points.mjs
      - scripts/check-published-compatibility.mjs
      - .github/workflows/developer-entry-points.yml
      - scripts/conformance.mjs
      - examples/action-boundary/**
      - packages/create-atp-agent/**
      - packages/sdk/**
      - packages/did-atp/**
  push:
    branches: [main]
    paths:
      - scripts/verify-published-entry-points.mjs
      - scripts/check-published-compatibility.mjs
      - .github/workflows/developer-entry-points.yml
      - scripts/conformance.mjs
      - examples/action-boundary/**

permissions:
  contents: read

jobs:
  published:
    name: Published compatibility (18 is a negative probe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-published-compatibility.mjs

  repository:
    name: Action-boundary demo and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Run the documented action-boundary flow
        working-directory: examples/action-boundary
        run: |
          npm ci
          npm start
          npm test
      - name: Install conformance dependencies
        run: npm ci --include=dev
      - name: Run all available conformance items
        run: npm run conformance
