name: Python packages
on:
  pull_request:
    paths:
      - 'packages/atp-profiles/**'
      - 'packages/atp-profiles-python/**'
      - 'packages/agent-trust-protocol-python/**'
      - '.github/workflows/python-packages.yml'
  push:
    branches: [main]
    paths:
      - 'packages/atp-profiles/**'
      - 'packages/atp-profiles-python/**'
      - 'packages/agent-trust-protocol-python/**'
      - '.github/workflows/python-packages.yml'
permissions:
  contents: read
jobs:
  conformance-sync:
    name: Python profiles match the TypeScript package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - working-directory: packages/atp-profiles
        run: |
          npm ci --include=dev --ignore-scripts
          npm run build
          npm run conformance:check

  test:
    name: atp-profiles (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and conformance tests (source tree)
        working-directory: packages/atp-profiles-python
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  wheels:
    name: Build and install wheels in a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/atp-profiles-python --outdir dist
          python -m build packages/agent-trust-protocol-python --outdir dist
          python -m twine check dist/*
      - name: Installed wheels pass the tests
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --find-links dist agent-trust-protocol
          cd packages/atp-profiles-python
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/venv/bin/python" -c "import atp_profiles, agent_trust_protocol; print(atp_profiles.__file__, atp_profiles.__version__)"
