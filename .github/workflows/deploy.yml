name: Deploy

on:
  push:
    branches: [main]

# Frontend (Next.js) is deployed automatically via Vercel's GitHub integration.
# This workflow only handles backend service deployments to Railway.

jobs:
  deploy-backend:
    name: Deploy services to Railway
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - identity-service
          - permission-service
          - audit-logger
          - vc-service
          - rpc-gateway
          - monitoring-service
          - payment-service
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        run: railway up --service ${{ matrix.service }} --detach
        working-directory: packages/${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
