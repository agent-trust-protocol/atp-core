name: Deploy

on:
  push:
    branches: [main]

# Frontend (Next.js) is deployed automatically via Vercel's GitHub integration.
# This workflow only handles backend service deployments to Railway.

jobs:
  # The `secrets` context cannot be read in a job-level `if:`, so a pre-check
  # job reads it in a step and exposes a boolean output the deploy job gates on.
  check-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: Deploy services to Railway
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has_token == 'true'
    strategy:
      matrix:
        service:
          - identity-service
          - permission-service
          - audit-logger
          - vc-service
          - rpc-gateway
          - monitoring-service
          - payment-service
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        run: railway up --service ${{ matrix.service }} --detach
        working-directory: packages/${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
