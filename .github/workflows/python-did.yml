name: Python DID primitives
on:
  pull_request:
    paths:
      - 'packages/did-atp-python/**'
      - 'packages/did-atp/**'
      - 'docs/specs/did-atp/test-vectors.json'
      - '.github/workflows/python-did.yml'
  push:
    branches: [main]
    paths:
      - 'packages/did-atp-python/**'
      - 'packages/did-atp/**'
      - 'docs/specs/did-atp/test-vectors.json'
      - '.github/workflows/python-did.yml'
permissions:
  contents: read
jobs:
  interop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci --include=dev --prefix packages/did-atp
      - run: npm test --prefix packages/did-atp
      - run: PYTHONPATH=packages/did-atp-python/src python -m unittest discover -s packages/did-atp-python/tests -v
      - name: Build and check clean wheel install
        run: |
          python -m pip install build twine
          python -m build packages/did-atp-python --outdir dist-python-did
          python -m twine check dist-python-did/*
          python -m venv "$RUNNER_TEMP/python-did"
          "$RUNNER_TEMP/python-did/bin/python" -m pip install --no-deps dist-python-did/*.whl
          "$RUNNER_TEMP/python-did/bin/python" -m unittest discover -s packages/did-atp-python/tests -v
          "$RUNNER_TEMP/python-did/bin/python" -m pip check

  crypto-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build optional crypto wheel
        run: |
          python -m pip install build twine
          python -m build packages/did-atp-python --outdir dist-python-did
          python -m twine check dist-python-did/*
          python -m venv "$RUNNER_TEMP/python-crypto"
          "$RUNNER_TEMP/python-crypto/bin/python" -m pip install "dist-python-did/atp_did-0.1.0-py3-none-any.whl[crypto]"
          npm install --prefix "$RUNNER_TEMP/sdk-reference" --no-package-lock atp-sdk@6.0.2
      - name: Verify both directions against the published SDK
        env:
          ATP_TEST_CRYPTO: '1'
        run: |
          export ATP_SDK_MODULE="file://$RUNNER_TEMP/sdk-reference/node_modules/atp-sdk/dist/index.js"
          "$RUNNER_TEMP/python-crypto/bin/python" -m unittest discover -s packages/did-atp-python/tests -v
          printf 'temporary integration passphrase\n' | "$RUNNER_TEMP/python-crypto/bin/python" packages/did-atp-python/examples/local_identity.py "$RUNNER_TEMP/example.keys.json"
          test -s "$RUNNER_TEMP/example.keys.json"
          "$RUNNER_TEMP/python-crypto/bin/python" -m pip check
