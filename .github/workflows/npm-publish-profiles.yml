name: Publish ATP Profiles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact atp-profiles version
        required: true
        type: string
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean
jobs:
  profiles:
    if: github.ref == 'refs/heads/main' || inputs.dry_run == true
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
      - name: Require npm 11.5.1+ (trusted publishing)
        run: |
          npm --version
          node -e "const v=process.argv[1].split('.').map(Number); const ok=v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))); if(!ok){console.error('npm '+process.argv[1]+' cannot use npm trusted publishing; need 11.5.1 or newer');process.exit(1)}" "$(npm --version)"
      - name: Validate version
        working-directory: packages/atp-profiles
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          if npm view "atp-profiles@$EXPECTED_VERSION" version >/dev/null 2>&1; then
            echo "Version already published"
            exit 1
          fi
      - run: npm ci --include=dev
        working-directory: packages/atp-profiles
      - run: npm test
        working-directory: packages/atp-profiles
      - run: npm pack --dry-run
        working-directory: packages/atp-profiles
      - name: Publish with trusted identity
        if: inputs.dry_run != true
        working-directory: packages/atp-profiles
        # Authenticates with GitHub's OIDC token via npm trusted publishing; no stored npm token.
        run: npm publish --access public --provenance
