version: '3.8'

# ─── Local development compose ────────────────────────────────────────────────
# Copy .env.example to .env and fill in values before running.
# On Railway, DATABASE_URL is injected automatically per-service.
#
# Start everything:  docker compose up
# First-time setup:  docker compose up db-migrate   (runs once, then exits)

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-atp_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atp_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Migrations (runs once, exits) ─────────────────────────────────────────────
  db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./packages/shared/src/database/migrations:/migrations:ro
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h postgres -U ${POSTGRES_USER:-atp_user}; do sleep 1; done &&
        echo 'Running init-db.sql...' &&
        psql -h postgres -U ${POSTGRES_USER:-atp_user} -d ${POSTGRES_DB:-atp_local} -f /docker-entrypoint-initdb.d/01-init.sql &&
        echo 'Running migrations...' &&
        for f in /migrations/*.sql; do
          echo \"  applying \$$f\" &&
          psql -h postgres -U ${POSTGRES_USER:-atp_user} -d ${POSTGRES_DB:-atp_local} -f \$$f;
        done &&
        echo 'Migrations complete.'
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  # ── Backend services ──────────────────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: docker/identity-service.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atp_local}}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  vc-service:
    build:
      context: .
      dockerfile: docker/vc-service.Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atp_local}}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  permission-service:
    build:
      context: .
      dockerfile: docker/permission-service.Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atp_local}}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  audit-logger:
    build:
      context: .
      dockerfile: docker/audit-logger.Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atp_local}}
      - AUDIT_ENCRYPTION_KEY=${AUDIT_ENCRYPTION_KEY:?AUDIT_ENCRYPTION_KEY is required}
      - IPFS_URL=${IPFS_URL:-http://ipfs:5001}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  protocol-integrations:
    build:
      context: .
      dockerfile: docker/protocol-integrations.Dockerfile
    ports:
      - "3006:3006"
      - "3007:3007"
    environment:
      - PORT=3006
      - MCP_PORT=3007
    depends_on:
      - identity-service
      - audit-logger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  payment-service:
    build:
      context: ./packages/payment-service
      dockerfile: Dockerfile
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-atp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atp_local}}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  quantum-safe-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atp-quantum-safe-server
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3008
      - ATP_LOG_LEVEL=${ATP_LOG_LEVEL:-info}
      - ATP_QUANTUM_SAFE=true
      - ATP_TRUST_LEVELS=basic,verified,enterprise
      - ATP_RATE_LIMIT_ENABLED=true
    depends_on:
      - identity-service
      - audit-logger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  rpc-gateway:
    build:
      context: .
      dockerfile: docker/rpc-gateway.Dockerfile
    ports:
      - "3000:3000"
      - "8081:8081"
    environment:
      - PORT=3000
      - WS_PORT=8081
    depends_on:
      - identity-service
      - vc-service
      - permission-service
      - audit-logger
      - protocol-integrations
      - payment-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/ssl/certs:ro
    depends_on:
      - rpc-gateway
    restart: unless-stopped

  ipfs:
    image: ipfs/go-ipfs:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    restart: unless-stopped

volumes:
  postgres_data:
  identity_data:
  vc_data:
  permission_data:
  audit_data:
  ipfs_data:

networks:
  default:
    name: atp-network
