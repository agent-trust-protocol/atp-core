[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atp-did"
version = "0.1.0"
description = "Experimental offline Agent Trust Protocol DID identifier and key-binding primitives"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=44,<51", "pqcrypto==0.3.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/atp_did"]

[tool.hatch.build.targets.sdist]
include = ["src/atp_did", "README.md", "LICENSE", "pyproject.toml"]
